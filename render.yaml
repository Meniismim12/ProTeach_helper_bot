# Render Blueprint.
#
# MUHIM: xizmatni Dashboard -> New -> **Blueprint** orqali yarating.
# "New -> Web Service" qilib qo'lda yaratilsa bu fayl umuman o'qilmaydi va
# Render Python uchun o'zining standart `gunicorn` komandasini ishlatadi
# (natija: `gunicorn: command not found`, status 127).
#
# BOT_TOKEN, OWNER_ID va DATABASE_URL ni Render dashboardidan kiritasiz —
# ular `sync: false` bo'lgani uchun repoga tushmaydi.
services:
  - type: web
    name: proteach-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      # Neon Postgres ulanish satri. Bo'sh qoldirilsa SQLite ishlatiladi va
      # Render'ning o'chuvchan diskida ma'lumot har deployda yo'qoladi.
      - key: DATABASE_URL
        sync: false
